<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FlagCapMan</title>
    <link rel="stylesheet" href="./styles/style.css" />
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <h1 class="header_title">Welcome to FlagCapMan 🌍</h1>
    </header>

    <main class="container">
      <h2 class="question">Which country does the flag below belong to?</h2>
      <img class="flag" src="" alt="Flag" />

      <img
        class="hangman-image"
        src=""
        alt="Hangman Stage"
        style="display: none"
      />
      <p class="result"></p>

      <div class="word"></div>

      <div class="options"></div>

      <p class="score">Score: 0</p>
    </main>

    <footer class="footer">
      <p>&copy; 2025 Arash / FlagCapMan - v1.0</p>
    </footer>
  </body>
</html>
